name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Expected a version like 1.2.3, got '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish payload
        shell: pwsh
        run: ./installer/Publish.ps1 -Architecture x64

      - name: Install Inno Setup
        shell: pwsh
        # Unconditional upgrade rather than a presence check: the script needs 6.3 or
        # newer for the x64compatible architecture identifier, and the runner image
        # pins whatever version it happens to ship.
        run: choco upgrade innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DArchitecture=x64 `
            installer\Mica.iss

          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v4
        with:
          name: MicaSetup-${{ steps.version.outputs.version }}-x64
          path: dist/MicaSetup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MicaSetup-*.exe
          draft: true
          generate_release_notes: true
          body: |
            Mica ${{ steps.version.outputs.version }} — build a native Windows app from any URL.

            Installs per user, no Developer Mode and no administrator rights. The
            installer fetches the Windows App Runtime if it is not already present.
