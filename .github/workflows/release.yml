name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Expected a version like 1.2.3, got '$version'."
          }

          # The version is stamped into the assemblies by Publish.ps1 and into the
          # installer by ISCC, but the csproj <Version> is the value a local build
          # carries and what the in-app update check reads. A tag whose version has
          # drifted behind the csproj (or ahead of it) ships a setup that disagrees
          # with itself, so fail here rather than build something misleading.
          foreach ($project in 'Mica.Builder', 'Mica.Host') {
            $csproj = Get-Content "$project/$project.csproj" -Raw
            if ($csproj -notmatch "<Version>\s*$([regex]::Escape($version))\s*</Version>") {
              throw "$project.csproj <Version> does not match the release tag '$version'. Bump it before tagging."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish payload
        shell: pwsh
        # The version is stamped into the assemblies: Mica compares it against the
        # latest release tag to decide whether an update exists.
        run: ./installer/Publish.ps1 -Architecture x64 -Version ${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        shell: pwsh
        # Unconditional upgrade rather than a presence check: the script needs 6.3 or
        # newer for the x64compatible architecture identifier, and the runner image
        # pins whatever version it happens to ship.
        run: choco upgrade innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DArchitecture=x64 `
            installer\Mica.iss

          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Extract the release notes
        shell: pwsh
        # Mica shows these in its update notice, picking the reader's language, so the
        # release body has to be the changelog section rather than a generic blurb.
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^##\s+$([regex]::Escape($version))\s*$" | Select-Object -First 1).LineNumber

          if (-not $start) { throw "CHANGELOG.md has no section for $version." }

          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }

          ($body -join "`n").Trim() | Set-Content release-notes.md -Encoding UTF8
          Get-Content release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: MicaSetup-${{ steps.version.outputs.version }}-x64
          path: dist/MicaSetup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MicaSetup-*.exe
          draft: true
          body_path: release-notes.md
